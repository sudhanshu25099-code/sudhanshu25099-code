<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" font-family="'Comic Sans MS', 'Segoe Print', 'Trebuchet MS', cursive, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fff0f0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="100%" stop-color="#c81e1e"/>
    </radialGradient>
  </defs>

  <!-- outer border -->
  <rect x="4" y="4" width="1192" height="392" rx="14" fill="url(#bg)" stroke="#111111" stroke-width="8"/>

  <!-- faint cloud shapes -->
  <g fill="#ffe1e1" opacity="0.6">
    <ellipse cx="150" cy="60" rx="70" ry="16"/>
    <ellipse cx="600" cy="40" rx="90" ry="14"/>
    <ellipse cx="980" cy="55" rx="60" ry="14"/>
  </g>

  <!-- ===================== LEFT: signpost + walking stickman ===================== -->
  <g stroke="#111111" stroke-width="3" fill="none">
    <!-- ground hill -->
    <path d="M0,360 Q120,330 260,355 T400,360 L400,400 L0,400 Z" fill="#e9e9e9" stroke="none"/>
    <!-- grass tufts -->
    <path d="M20,358 l4,-14 M28,358 l4,-16 M36,358 l4,-14" stroke="#333"/>
    <path d="M300,362 l4,-14 M308,362 l4,-16 M316,362 l4,-14" stroke="#333"/>
  </g>

  <!-- handwritten note top-left -->
  <text x="30" y="45" font-size="20" fill="#111111" font-style="italic">Same</text>
  <text x="30" y="70" font-size="20" fill="#111111" font-style="italic">Student...</text>
  <text x="30" y="95" font-size="22" fill="#c81e1e" font-weight="bold" font-style="italic">Bigger Dreams!</text>
  <path d="M115,55 q30,10 45,40" stroke="#111111" stroke-width="2.5" fill="none" marker-end="url(#arrow1)"/>

  <!-- signpost -->
  <g stroke="#111111" stroke-width="4" fill="none">
    <line x1="80" y1="330" x2="80" y2="150"/>
  </g>
  <g font-size="15" font-weight="bold" fill="#111111">
    <g>
      <polygon points="30,145 130,145 140,160 130,175 30,175 20,160" fill="#ffffff" stroke="#c81e1e" stroke-width="3"/>
      <text x="80" y="165" text-anchor="middle">IDEAS</text>
    </g>
    <g>
      <polygon points="25,180 125,180 135,195 125,210 25,210 15,195" fill="#111111" stroke="#111111" stroke-width="3"/>
      <text x="75" y="200" text-anchor="middle" fill="#ffffff">CODE</text>
    </g>
    <g>
      <polygon points="30,215 130,215 140,230 130,245 30,245 20,230" fill="#ffffff" stroke="#c81e1e" stroke-width="3"/>
      <text x="80" y="235" text-anchor="middle">LEARN</text>
    </g>
    <g>
      <polygon points="30,250 130,250 140,265 130,280 30,280 20,265" fill="#c81e1e" stroke="#c81e1e" stroke-width="3"/>
      <text x="80" y="270" text-anchor="middle" fill="#ffffff">BUILD</text>
    </g>
    <g>
      <polygon points="25,285 135,285 145,300 135,315 25,315 15,300" fill="#ffffff" stroke="#111111" stroke-width="3"/>
      <text x="80" y="305" text-anchor="middle">IMPACT</text>
    </g>
  </g>

  <!-- walking stickman with red jacket + black backpack -->
  <g transform="translate(210,190)" stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round">
    <circle cx="30" cy="10" r="14" fill="#ffffff" stroke="#111111"/>
    <!-- backpack -->
    <rect x="10" y="26" width="20" height="30" rx="5" fill="#111111" stroke="#111111"/>
    <!-- body / jacket -->
    <path d="M30,24 L30,70" stroke="#c81e1e" stroke-width="12"/>
    <!-- arms -->
    <path d="M30,34 L8,55" stroke="#c81e1e" stroke-width="8"/>
    <path d="M30,34 L54,50" stroke="#111111" stroke-width="6"/>
    <!-- legs walking pose -->
    <path d="M30,70 L14,112" stroke="#111111" stroke-width="7"/>
    <path d="M30,70 L52,108" stroke="#111111" stroke-width="7"/>
    <!-- feet -->
    <path d="M14,112 L2,116" stroke="#111111" stroke-width="7"/>
    <path d="M52,108 L66,100" stroke="#111111" stroke-width="7"/>
  </g>

  <!-- ===================== CENTER: title block ===================== -->
  <text x="320" y="95" font-size="26" fill="#111111">Hi, I'm</text>
  <text x="320" y="150" font-size="52" font-weight="900" font-family="'Trebuchet MS', Arial, sans-serif">
    <tspan fill="#c81e1e">Sudhanshu</tspan><tspan fill="#111111"> Shekhar Jha</tspan>
  </text>
  <text x="320" y="182" font-size="17" fill="#333333" font-family="Arial, sans-serif">
    Computer Science Engineering Student &#160;|&#160; AI/ML Builder &#160;|&#160; Full-Stack Developer
  </text>
  <text x="320" y="220" font-size="18" fill="#111111" font-style="italic" font-family="'Trebuchet MS', Arial, sans-serif">
    <tspan x="320" dy="0">I build practical AI systems that solve real-world problems —</tspan>
    <tspan x="320" dy="26">from student wellness to healthcare workflows.</tspan>
  </text>

  <!-- portfolio button -->
  <g>
    <rect x="320" y="270" width="270" height="46" rx="23" fill="#c81e1e"/>
    <circle cx="352" cy="293" r="12" fill="none" stroke="#ffffff" stroke-width="2.5"/>
    <line x1="340" y1="293" x2="364" y2="293" stroke="#ffffff" stroke-width="2"/>
    <path d="M352,281 a17,12 0 0,1 0,24 a17,12 0 0,1 0,-24" stroke="#ffffff" stroke-width="2" fill="none"/>
    <text x="378" y="288" font-size="16" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">Visit My Portfolio</text>
    <text x="378" y="306" font-size="11" fill="#ffe1e1" font-family="Arial, sans-serif">sudhanshu-shekhar-jha.me</text>
    <path d="M558,293 l14,0 M566,286 l8,7 -8,7" stroke="#ffffff" stroke-width="2.5" fill="none"/>
  </g>

  <!-- social icons -->
  <g font-family="Arial, sans-serif">
    <rect x="610" y="270" width="46" height="46" rx="10" fill="#111111"/>
    <path d="M633,280 a13,13 0 1,0 0.1,0 M626,300 q7,4 14,0 M624,296 c-4,1 -6,-2 -6,-5 M642,296 c4,1 6,-2 6,-5" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>

    <rect x="666" y="270" width="46" height="46" rx="10" fill="#0a66c2"/>
    <text x="689" y="300" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffffff">in</text>

    <rect x="722" y="270" width="46" height="46" rx="10" fill="#c81e1e"/>
    <path d="M730,283 h30 v20 h-30 z M730,283 l15,12 l15,-12" stroke="#ffffff" stroke-width="2" fill="none" stroke-linejoin="round"/>
  </g>
  <path d="M700,322 q0,20 -60,20" stroke="#111111" stroke-width="2" fill="none"/>
  <text x="630" y="358" font-size="14" fill="#111111" font-style="italic">All roads lead to my portfolio!</text>
  <path d="M628,362 q60,6 100,-4" stroke="#c81e1e" stroke-width="2.5" fill="none"/>

  <!-- ===================== RIGHT: mountain + coder stickman ===================== -->
  <g stroke="#111111" stroke-width="3">
    <!-- mountains -->
    <polygon points="900,340 990,190 1050,270 1090,210 1170,340" fill="#e5e5e5"/>
    <polygon points="1000,340 1060,240 1110,300 1140,260 1180,340" fill="#cfcfcf"/>
    <!-- snow caps -->
    <polygon points="990,190 1005,215 975,215" fill="#ffffff" stroke="none"/>
    <polygon points="1090,210 1102,230 1078,230" fill="#ffffff" stroke="none"/>
  </g>

  <!-- sun -->
  <circle cx="1055" cy="115" r="30" fill="url(#sunGlow)"/>
  <text x="1105" y="55" font-size="16" fill="#111111" font-style="italic">...Bigger</text>
  <text x="1120" y="78" font-size="16" fill="#111111" font-style="italic">Impact!</text>
  <path d="M1145,85 q10,20 -20,35" stroke="#111111" stroke-width="2" fill="none"/>

  <!-- rock with words -->
  <ellipse cx="985" cy="320" rx="90" ry="55" fill="#1a1a1a"/>
  <text x="985" y="298" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">BETTER</text>
  <text x="985" y="316" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">TECH</text>
  <text x="985" y="334" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">BRIGHTER</text>
  <text x="985" y="352" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff" font-family="Arial, sans-serif">PEOPLE</text>

  <!-- coder stickman sitting with laptop on rock -->
  <g transform="translate(935,215)" stroke="#111111" stroke-width="4" fill="none" stroke-linecap="round">
    <circle cx="15" cy="10" r="13" fill="#ffffff" stroke="#111111"/>
    <rect x="-2" y="22" width="18" height="26" rx="5" fill="#111111"/>
    <path d="M15,22 L15,55" stroke="#c81e1e" stroke-width="11"/>
    <path d="M15,32 L40,48" stroke="#c81e1e" stroke-width="7"/>
    <path d="M15,55 L2,80" stroke="#111111" stroke-width="7"/>
    <path d="M15,55 L34,72" stroke="#111111" stroke-width="7"/>
    <!-- laptop -->
    <path d="M32,44 l24,8 l-4,10 l-24,-8 z" fill="#dddddd" stroke="#111111" stroke-width="2"/>
    <path d="M52,52 l6,14 l-24,9 l-3,-11 z" fill="#f5f5f5" stroke="#111111" stroke-width="2"/>
  </g>

  <!-- speech bubble text near coder -->
  <text x="1108" y="255" font-size="15" fill="#111111" font-style="italic" text-anchor="middle">"Build</text>
  <text x="1128" y="278" font-size="15" fill="#111111" font-style="italic" text-anchor="middle">Solve</text>
  <text x="1148" y="301" font-size="15" fill="#111111" font-style="italic" text-anchor="middle">Learn</text>
  <text x="1160" y="324" font-size="15" fill="#c81e1e" font-weight="bold" font-style="italic" text-anchor="middle">Repeat"</text>
  <path d="M1130,330 q40,4 70,-6" stroke="#c81e1e" stroke-width="2.5" fill="none"/>

  <!-- ground on right -->
  <path d="M880,360 Q1000,335 1100,358 T1200,360 L1200,400 L880,400 Z" fill="#e9e9e9" stroke="none"/>
  <path d="M900,362 l4,-14 M908,362 l4,-16" stroke="#333" stroke-width="2"/>
  <path d="M1160,364 l4,-14 M1168,364 l4,-16" stroke="#333" stroke-width="2"/>
</svg>
